<footer class="mini-player" [class.mini-player--hidden]="!player.current()">
  @if (player.current(); as current) {
    <div class="mini-player__meta">
      <span class="mini-player__title">{{ current.song.title }}</span>
      @if (current.recording.takeLabel) {
        <span class="mini-player__take">({{ current.recording.takeLabel }})</span>
      }
    </div>
    <div class="mini-player__transport">
      <button
        type="button"
        class="mini-player__nav mini-player__nav--prev"
        [disabled]="!player.hasPrevious()"
        (click)="onPrevious()"
        aria-label="Previous track"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
        </svg>
      </button>
      <app-play-pause-button
        variant="mini"
        [state]="playPauseState()"
        (toggle)="onTogglePlay()"
      />
      <button
        type="button"
        class="mini-player__nav mini-player__nav--next"
        [disabled]="!player.hasNext()"
        (click)="onNext()"
        aria-label="Next track"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path d="M16 6h2v12h-2zM4.5 18l8.5-6-8.5-6z" />
        </svg>
      </button>
    </div>
    <div class="mini-player__scrub">
      <span class="mini-player__time">{{ formattedCurrentTime() }}</span>
      <input
        type="range"
        class="mini-player__seek"
        min="0"
        [max]="duration()"
        [value]="currentTime()"
        (input)="onSeek($event)"
        aria-label="Seek"
      />
      <span class="mini-player__time">{{ formattedDuration() }}</span>
    </div>
    <button
      type="button"
      class="mini-player__nav mini-player__share"
      [disabled]="isSharing()"
      (click)="onShare()"
      aria-label="Share or download recording"
    >
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
        <path
          d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L7.04 9.81C6.5 9.31 5.79 9 5 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"
        />
      </svg>
    </button>
  }
  <audio
    #audioEl
    [hidden]="true"
    (play)="onAudioPlay()"
    (pause)="onAudioPause()"
    (ended)="onAudioEnded()"
    (timeupdate)="onTimeUpdate()"
    (loadedmetadata)="onLoadedMetadata()"
    (waiting)="onWaiting()"
    (canplay)="onPlayable()"
    (playing)="onPlayable()"
    (error)="onAudioError()"
  ></audio>
</footer>
