<button
  type="button"
  class="play-pause-button"
  [class.play-pause-button--mini]="variant() === 'mini'"
  (click)="toggle.emit()"
  [attr.aria-busy]="state() === 'loading'"
  [attr.aria-label]="state() === 'playing' ? 'Pause' : 'Play'"
>
  @if (state() === 'loading') {
    <span class="play-pause-button__spinner" aria-hidden="true"></span>
  } @else if (state() === 'playing') {
    <svg
      viewBox="0 0 24 24"
      [attr.width]="variant() === 'mini' ? 22 : 18"
      [attr.height]="variant() === 'mini' ? 22 : 18"
      fill="currentColor"
      aria-hidden="true"
    >
      <path d="M6 5h4v14H6zM14 5h4v14h-4z" />
    </svg>
  } @else {
    <svg
      viewBox="0 0 24 24"
      [attr.width]="variant() === 'mini' ? 22 : 18"
      [attr.height]="variant() === 'mini' ? 22 : 18"
      fill="currentColor"
      aria-hidden="true"
    >
      <path d="M8 5v14l11-7z" />
    </svg>
  }
</button>
